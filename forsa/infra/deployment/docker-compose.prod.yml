# FORSA — production stack on one server (Docker Compose v2).
# HTTPS is automatic (Caddy + Let's Encrypt) for $FORSA_DOMAIN. Only ports 80/443 are exposed.
# Usage: ./deploy.sh   (creates .env with generated secrets on first run)
name: forsa

x-backend: &backend
  build: {context: ../.., dockerfile: backend/Dockerfile}
  image: forsa-backend:latest
  env_file: .env
  environment:
    FORSA_ENV: prod
    FORSA_DATABASE_URL: postgresql+psycopg://forsa:${FORSA_DB_PASSWORD}@db:5432/forsa
    FORSA_COOKIE_SECURE: "true"
    FORSA_CORS_ORIGINS: '["https://${FORSA_DOMAIN}"]'
  volumes: [storage:/data/storage]
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres            # admin only — the app uses the non-superuser role "forsa"
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      FORSA_DB_PASSWORD: ${FORSA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forsa"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["forsa", "db-upgrade"]
    restart: "no"
    depends_on: {db: {condition: service_healthy}}

  api:
    <<: *backend
    depends_on: {migrate: {condition: service_completed_successfully}}

  worker:
    <<: *backend
    command: ["forsa", "worker"]
    healthcheck: {disable: true}
    depends_on: {migrate: {condition: service_completed_successfully}}

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args: {FORSA_API_URL: "http://api:8000"}
    image: forsa-web:latest
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      FORSA_DOMAIN: ${FORSA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web]

  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    # Nightly logical backup (custom format), pruned after BACKUP_KEEP_DAYS.
    command:
      - >
        while true; do
          pg_dump -h db -U postgres -d forsa -Fc -f /backups/forsa-$$(date +%Y%m%d-%H%M).dump &&
          find /backups -name 'forsa-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete;
          sleep 86400;
        done
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
