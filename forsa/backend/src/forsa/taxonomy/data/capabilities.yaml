    parent: energy
    labels: {en: Solar photovoltaic installation, fr: Installation photovoltaïque, ar: تركيب أنظمة الطاقة الشمسية}
    terms:
      fr: [photovoltaïque, installation photovoltaïque, énergie solaire, panneaux solaires, panneau solaire,
           systèmes pv, système pv, installation solaire, kits solaires, kit solaire, centrale solaire,
           modules photovoltaïques, électrification solaire]
      ar: [الطاقة الشمسية, ألواح شمسية, الألواح الشمسية, تركيب أنظمة الطاقة الشمسية, الخلايا الكهروضوئية,
           محطة شمسية]
      en: [solar photovoltaic, photovoltaic, solar pv, solar panels, solar energy, solar power plant,
           solar home systems, solar kits]
  - id: energy.solar_pumping
    parent: energy.solar_pv
    labels: {en: Solar water pumping, fr: Pompage solaire, ar: الضخ بالطاقة الشمسية}
    terms:
