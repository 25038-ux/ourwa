# Credentials that tenders commonly require. `obtainable_days` is an
# ESTIMATE used only to decide whether a gap is remediable before a deadline;
# it must be validated with local practitioners (tracked in docs/project-state.md).
credentials:
  - id: cred.tax_clearance
    labels: {en: Tax clearance certificate, fr: Attestation fiscale / quitus fiscal, ar: شهادة المخالصة الضريبية}
    terms:
      fr: [attestation fiscale, quitus fiscal, attestation de régularité fiscale, situation fiscale]
      ar: [شهادة ضريبية, براءة الذمة الضريبية, المخالصة الضريبية]
      en: [tax clearance, tax compliance certificate]
    obtainable_days: 7
  - id: cred.social_security
    labels: {en: Social security certificate, fr: Attestation CNSS, ar: شهادة الضمان الاجتماعي}
    terms:
      fr: [attestation cnss, attestation de la cnss, sécurité sociale, cnss]
      ar: [الضمان الاجتماعي, شهادة الضمان الاجتماعي]
      en: [social security certificate]
    obtainable_days: 7
  - id: cred.trade_register
    labels: {en: Trade register extract, fr: Registre du commerce, ar: السجل التجاري}
    terms:
      fr: [registre du commerce, registre de commerce, rccm, extrait du registre]
      ar: [السجل التجاري, سجل تجاري]
      en: [trade register, commercial register, business registration]
    obtainable_days: 5
  - id: cred.iso_9001
    labels: {en: ISO 9001 certification, fr: Certification ISO 9001, ar: شهادة الأيزو 9001}
    terms:
      fr: [iso 9001, certification iso 9001]
      ar: [أيزو 9001, الأيزو 9001]
      en: [iso 9001]
    obtainable_days: 180
  - id: cred.iso_14001
    labels: {en: ISO 14001 certification, fr: Certification ISO 14001, ar: شهادة الأيزو 14001}
    terms:
      fr: [iso 14001]
      ar: [أيزو 14001]
      en: [iso 14001]
    obtainable_days: 180
  - id: cred.bid_security
    labels: {en: Bid security, fr: Garantie de soumission, ar: ضمان العرض}
    terms:
      fr: [garantie de soumission, caution de soumission, garantie d'offre, caution bancaire]
      ar: [ضمان العرض, كفالة العرض, ضمان بنكي]
      en: [bid security, bid bond, bid guarantee]
    obtainable_days: 5
    per_bid: true  # issued for each bid by a bank — never "held" in a profile
  - id: cred.sector_license
    labels: {en: Sector licence / accreditation, fr: Agrément, ar: الاعتماد}
    terms:
      fr: [agrément, agrément technique, licence d'exploitation, habilitation]
      ar: [اعتماد, رخصة, ترخيص]
      en: [license, licence, accreditation]
    obtainable_days: 60
