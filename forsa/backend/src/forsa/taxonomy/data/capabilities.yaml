# FORSA canonical capability ontology (seed).
#
# * Concept IDs are language-neutral and stable — never rename, only deprecate.
# * `terms` are multilingual surface forms mapped to the concept (spec §10–11).
# * `codes` is where verified UNSPSC / CPV mappings go. They are intentionally
#   empty: do NOT add codes without checking the official code lists.
# * Provenance: every term here is curated (`curated:forsa-core-v1`, confidence
#   MEDIUM). Terms learned from data must be added with their own provenance.
version: forsa-capabilities-v1
provenance: curated:forsa-core-v1
default_confidence: MEDIUM

concepts:
  # ── Energy ────────────────────────────────────────────────────────────────
  - id: energy
    labels: {en: Energy, fr: Énergie, ar: الطاقة}
