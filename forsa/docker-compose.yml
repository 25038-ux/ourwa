# Local development stack: Postgres (+pgvector image, ready for the embeddings phase), API, worker, web.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forsa}
      POSTGRES_DB: forsa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forsa"]
      interval: 5s
      retries: 10
    # NB: the app connects as the table owner; RLS is FORCEd so the owner is still subject to policies.
    # Never connect the app as a superuser — superusers bypass row-level security.

  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["forsa", "db-upgrade"]
    depends_on: {db: {condition: service_healthy}}

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on: {migrate: {condition: service_completed_successfully}}

  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["forsa", "worker"]
    volumes: [storage:/data/storage]
    depends_on: {migrate: {condition: service_completed_successfully}}

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    environment:
      FORSA_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
