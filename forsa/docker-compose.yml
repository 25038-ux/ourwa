# Local development stack: Postgres (+pgvector image, ready for the embeddings phase), API, worker, web.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres          # admin only; the app uses the non-superuser role "forsa" (initdb script)
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      FORSA_DB_PASSWORD: ${FORSA_DB_PASSWORD:-forsa}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/deployment/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forsa"]
      interval: 5s
      retries: 10
    # The app connects as the table owner "forsa" (NOSUPERUSER, NOBYPASSRLS); RLS is FORCEd so the owner is still
    # subject to policies. Superusers bypass RLS — the API refuses to start in prod if its role is one.

  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["forsa", "db-upgrade"]
    depends_on: {db: {condition: service_healthy}}

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on: {migrate: {condition: service_completed_successfully}}

  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["forsa", "worker"]
    volumes: [storage:/data/storage]
    depends_on: {migrate: {condition: service_completed_successfully}}

  web:
    build: {context: ., dockerfile: web/Dockerfile, args: {FORSA_API_URL: "http://api:8000"}}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
