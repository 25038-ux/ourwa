name: forsa-ios
# Builds the FORSA iPhone app on macOS.
#  * build  (always): simulator app, unsigned archive + unsigned IPA, simulator screenshots of the setup screen.
#  * signed (only when the repository variable IOS_TEAM_ID is set): App Store signed IPA, optional TestFlight upload.
#    Needs secrets IOS_ASC_KEY_ID, IOS_ASC_ISSUER_ID, IOS_ASC_KEY_P8 (App Store Connect API key, "Admin" or
#    "App Manager" role) — Xcode then creates the certificates and profiles itself (cloud-managed signing).
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the signed build to TestFlight (needs IOS_TEAM_ID + App Store Connect key)"
        type: boolean
        default: false
  push:
    paths: ["forsa/ios/**", ".github/workflows/forsa-ios.yml"]

permissions:
  contents: read

env:
  VERSION: "1.0.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forsa/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project FORSA.xcodeproj -scheme FORSA -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|warning:|BUILD" || true
          test -d build/sim/Build/Products/Release-iphonesimulator/FORSA.app

      - name: Archive for devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project FORSA.xcodeproj -scheme FORSA -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/FORSA.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive 2>&1 \
            | tee build-device.log | grep -E "error:|warning:|ARCHIVE" || true
          test -d build/FORSA.xcarchive/Products/Applications/FORSA.app

      - name: Package
        run: |
          mkdir -p dist/Payload
          cp -R build/FORSA.xcarchive/Products/Applications/FORSA.app dist/Payload/
          (cd dist && zip -qry "FORSA-$VERSION-unsigned.ipa" Payload && rm -rf Payload)
          ditto -c -k --keepParent build/FORSA.xcarchive "dist/FORSA-$VERSION-unsigned.xcarchive.zip"
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/FORSA.app "dist/FORSA-$VERSION-simulator.app.zip"
          cp build-sim.log build-device.log dist/
          /usr/libexec/PlistBuddy -c Print build/FORSA.xcarchive/Products/Applications/FORSA.app/Info.plist > dist/Info.plist.txt
          ls -la dist

      - name: Launch in the Simulator and take screenshots
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          best = [d for d in phones if "Pro Max" in d["name"]] or phones
          print(best[-1]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/FORSA.app
          mkdir -p dist/simulator-screenshots
          for lang in fr en ar; do
            xcrun simctl terminate "$UDID" mr.forsa.app || true
            xcrun simctl launch "$UDID" mr.forsa.app -AppleLanguages "($lang)" -AppleLocale "$lang"
            sleep 6
            xcrun simctl io "$UDID" screenshot "dist/simulator-screenshots/setup-$lang.png"
          done
          xcrun simctl shutdown "$UDID" || true

      - uses: actions/upload-artifact@v4
        with:
          name: FORSA-iOS-${{ env.VERSION }}-build
          path: forsa/ios/dist
          if-no-files-found: error

  signed:
    if: ${{ vars.IOS_TEAM_ID != '' }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forsa/ios
    env:
      TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.IOS_ASC_KEY_P8 }}
      DEFAULT_SERVER: ${{ vars.FORSA_DEFAULT_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (signed, cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild -project FORSA.xcodeproj -scheme FORSA -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FORSA.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" FORSA_DEFAULT_SERVER="$DEFAULT_SERVER" \
            archive 2>&1 | tail -40
      - name: Export the App Store IPA
        run: |
          cp ci/ExportOptions-AppStore.plist "$RUNNER_TEMP/export.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/export.plist"
          if [ "${{ inputs.upload_testflight }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :destination upload" "$RUNNER_TEMP/export.plist"
          fi
          xcodebuild -exportArchive -archivePath build/FORSA.xcarchive -exportPath dist \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la dist
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - uses: actions/upload-artifact@v4
        with:
          name: FORSA-iOS-${{ env.VERSION }}-appstore-signed
          path: forsa/ios/dist
          if-no-files-found: warn
