pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Android 16 (API 36). ⚠ LES MINIMUMS DE FLUTTER 3.47.5 (le poste, 23/09/2026) :
    // AGP ≥ 8.11.1, Kotlin ≥ 2.2.20, Gradle ≥ 8.14 (DependencyVersionChecker.kt
    // de Flutter). 8.11.1 / 2.2.20 / 8.14 est le trio du gabarit de Flutter 3.38 :
    // on reste sur AGP 8 — le gabarit de 3.47 passe à AGP 9, dont le nouveau DSL
    // casse des greffons (workmanager, impression) ; gradle.properties garde les
    // deux options de retrait (newDsl, builtInKotlin) posées par Flutter.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
